[package]
name = "golfer-firmware"
version = "0.1.0"
edition = "2024"
resolver = "2"
license = "MIT OR Apache-2.0"

# -----------------------------------------------------------------------------
# Embassy / RP2350
# -----------------------------------------------------------------------------

[dependencies]
embassy-executor = { version = "=0.10.0", features = ["defmt"] }
embassy-sync = { version = "=0.8.0", features = ["defmt"] }

embassy-time = { version = "=0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }

embassy-rp = { version = "=0.10.0", default-features = false, features = [
    "rp235xa",
    "rt",
    "defmt",
    "time-driver",
    "critical-section-impl",
    "executor-thread",
] }

# -----------------------------------------------------------------------------
# Debugging / runtime
# -----------------------------------------------------------------------------

defmt = "=1.0.1"
defmt-rtt = "=1.0.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }
cortex-m-rt = "0.7"

# -----------------------------------------------------------------------------
# LoRa / hardware buses
# -----------------------------------------------------------------------------

lora-phy = { version = "=3.0.1", default-features = false }
embedded-hal-bus = { version = "=0.3.0", features = ["async"] }
embedded-io-async = "=0.7.0"

# -----------------------------------------------------------------------------
# Display / UI
# -----------------------------------------------------------------------------

mipidsi = "=0.10.0"
embedded-graphics = "=0.8.2"
heapless = "=0.9.3"
static_cell = "=2.1.1"

# -----------------------------------------------------------------------------
# Release profile
# -----------------------------------------------------------------------------

[profile.release]
debug = 2
lto = "thin"
codegen-units = 1
